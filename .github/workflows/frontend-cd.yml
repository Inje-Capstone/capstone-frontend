name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

env:
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/develop'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AI_DEMO_MODE: ${{ vars.VITE_AI_DEMO_MODE }}
        run: |
          : "${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}"
          npm run build
          test -s dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload frontend files
        run: |
          : "${S3_BUCKET_NAME:?S3_BUCKET_NAME must be set}"

          aws s3 sync dist/ "s3://$S3_BUCKET_NAME/" \
            --exclude "index.html" \
            --cache-control "public,max-age=300" \
            --only-show-errors

          aws s3 cp dist/index.html "s3://$S3_BUCKET_NAME/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          : "${CLOUDFRONT_DISTRIBUTION_ID:?CLOUDFRONT_DISTRIBUTION_ID must be set}"

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
